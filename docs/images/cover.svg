<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">GitHub OSS Radar</title>
  <desc id="description">Find your next open source. Discover, compare, and collect GitHub projects in your browser.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#263650" stroke-width=".75"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#3778f6" stop-opacity="0"/>
      <stop offset="1" stop-color="#3778f6" stop-opacity=".3"/>
    </linearGradient>
    <clipPath id="boundary"><rect width="1280" height="420" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#boundary)">
    <rect width="1280" height="420" fill="#111c30"/>
    <path d="M716 0h564v420H716z" fill="url(#grid)" opacity=".55"/>
    <path d="M716 0v420" stroke="#263650"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <g transform="translate(60 44)">
        <rect width="32" height="32" rx="9" fill="#3778f6"/>
        <g transform="translate(16 16)" fill="none" stroke="#fff">
          <circle r="10" stroke-opacity=".35"/><circle r="5" stroke-opacity=".6"/>
          <path d="M0 0 7-7" stroke-width="2" stroke-linecap="round"/>
          <circle r="1.8" fill="#fff" stroke="none"/>
        </g>
        <text x="46" y="22" fill="#f6f8fc" font-size="19" font-weight="650" letter-spacing=".5">GITHUB OSS RADAR</text>
      </g>
      <text x="57" y="165" fill="#f6f8fc" font-size="67" font-weight="700" letter-spacing="-2.5">Find your next</text>
      <text x="57" y="240" fill="#80aaff" font-size="67" font-weight="700" letter-spacing="-2.5">open source.</text>
      <text x="61" y="286" fill="#acbdd5" font-size="17" letter-spacing=".25">Discover. Compare. Make it yours.</text>
      <path d="M60 341h1160" stroke="#2c3b52"/>
      <text x="61" y="383" fill="#acbdd5" font-size="12" font-weight="500" letter-spacing="1.5">VUE 3</text>
      <circle cx="132" cy="379" r="2" fill="#536983"/>
      <text x="150" y="383" fill="#acbdd5" font-size="12" font-weight="500" letter-spacing="1.5">TYPESCRIPT</text>
      <circle cx="265" cy="379" r="2" fill="#536983"/>
      <text x="283" y="383" fill="#acbdd5" font-size="12" font-weight="500" letter-spacing="1.5">GITHUB REST API</text>
      <text x="1220" y="383" text-anchor="end" fill="#acbdd5" font-size="11" letter-spacing="1.7">BUILT FOR THE CURIOUS.</text>
    </g>
    <g transform="translate(995 173)">
      <g fill="none" stroke="#365073">
        <circle r="126"/><circle r="94"/><circle r="62"/><circle r="30"/>
        <path d="M-144 0h288M0-144v288" stroke-dasharray="3 7"/>
      </g>
      <path d="M0 0 0-126A126 126 0 0 1 89-89Z" fill="url(#sweep)"/>
      <path d="M0 0 89-89" stroke="#80aaff" stroke-width="2"/>
      <circle r="6" fill="#f6f8fc"/>
      <circle cx="-56" cy="27" r="5" fill="#80aaff"/>
      <circle cx="48" cy="49" r="5" fill="#e4bc69"/>
      <circle cx="-30" cy="-89" r="4" fill="#6fc1b5"/>
      <circle cx="-56" cy="27" r="11" fill="none" stroke="#80aaff" stroke-opacity=".3"/>
      <circle cx="48" cy="49" r="11" fill="none" stroke="#e4bc69" stroke-opacity=".3"/>
    </g>
    <g fill="#1b2b44" stroke="#3b5273" stroke-width="1">
      <rect x="803" y="72" width="44" height="44" rx="12"/>
      <rect x="1143" y="154" width="44" height="44" rx="12"/>
      <rect x="845" y="267" width="44" height="44" rx="12"/>
    </g>
    <g fill="none" stroke="#a8c6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="823" cy="92" r="7"/><path d="m828 97 6 6"/>
      <path d="M1156 166h7v18h-7zM1168 170h7v14h-7z"/>
